[env:native]
platform = native
build_flags = -std=c++17 -O2 -Wall -Wextra -Isrc
build_src_filter = +<core/> +<host/>
test_framework = unity
test_build_src = yes

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
# this board's CH340C bridge fails ("Invalid head of packet") above 115200 -- don't "optimise" this back up
upload_speed = 115200
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -std=gnu++17
    -Isrc
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D SPI_FREQUENCY=55000000
build_src_filter = +<core/> +<device/>
lib_deps = bodmer/TFT_eSPI@^2.5.43
