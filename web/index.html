<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>ClaudeBoy</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-256.png">
  <link rel="apple-touch-icon" href="icon-256.png">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body {
      display: grid; place-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* The panel is 320x240; scale it whole and keep the pixels square-edged. */
    canvas {
      width: min(100%, calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 4 / 3));
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <canvas id="panel" width="320" height="240"></canvas>
  <script type="module" src="app.js"></script>
</body>
</html>
